name: Build Cydia Repo Index

on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Generate Packages index
        run: |
          mkdir -p debs
          dpkg-scanpackages --multiversion debs > Packages
          bzip2 -fk Packages
          gzip -fk Packages

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.bz2 Packages.gz
          git diff --staged --quiet || git commit -m "Auto-update Packages index"
          git push
